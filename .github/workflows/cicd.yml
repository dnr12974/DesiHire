name: CI/CD Pipeline

on:
  push:
    branches:
      - main  # Runs only when pushing to main branch

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18

      - name: Install Dependencies
        run: npm install
        working-directory: api  

      - name: Run Tests
        run: npm test
        working-directory: api  

      - name: Build Docker Image
        run: docker build -t dheernr2974/desihire-backend .
        working-directory: api  

      - name: Log in to Docker Hub
        run: echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin

      - name: Push Docker Image to Docker Hub
        run: docker push dheernr2974/desihire-backend:latest

      - name: Send Slack Notification
        run: |
          curl -X POST -H 'Content-type: application/json' --data '{"text":"🚀 CI/CD Pipeline Success: Docker Image Pushed!"}' ${{ secrets.SLACK_WEBHOOK_URL }}
